<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>饲料与其他 | 浙江省轻纺供销有限公司</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .oils-section {
      padding: 84px 8% 96px;
      background: var(--white);
    }
    .oils-lead {
      max-width: 860px;
      margin: 32px 0 64px;
      font-size: 15px;
      line-height: 2;
      color: var(--gray);
      letter-spacing: .3px;
    }
    .prod-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2px;
      background: var(--line);
      border: 1px solid var(--line);
    }
    .prod-card {
      background: var(--white);
      padding: 44px 40px;
      position: relative;
      overflow: hidden;
      transition: background .4s var(--ease);
    }
    .prod-card::before {
      content: '';
      position: absolute; top: 0; left: 0;
      width: 3px; height: 0;
      background: var(--red);
      transition: height .5s var(--ease);
    }
    .prod-card:hover { background: #fcfbfa; }
    .prod-card:hover::before { height: 100%; }
    .prod-idx {
      position: absolute; top: 26px; right: 34px;
      font-size: 60px; font-weight: 700;
      color: var(--bg); line-height: 1;
      user-select: none;
      transition: color .4s;
    }
    .prod-card:hover .prod-idx { color: rgba(196,18,48,.06); }
    .prod-code {
      display: inline-block;
      font-size: 11px; letter-spacing: 2px;
      color: var(--red);
      border: 1px solid rgba(196,18,48,.3);
      padding: 3px 10px;
      margin-bottom: 16px;
    }
    .prod-name {
      font-size: 21px; font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--ink);
      margin-bottom: 6px;
    }
    .prod-name-en {
      font-size: 11px; letter-spacing: 1.5px;
      color: var(--muted); text-transform: uppercase;
      margin-bottom: 20px;
    }
    .prod-intro {
      font-size: 14px; color: var(--gray);
      line-height: 1.9;
      margin-bottom: 22px;
    }
    .prod-use-lbl {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 11px; letter-spacing: 2px;
      color: var(--ink); font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .prod-use-lbl::before {
      content: '';
      width: 14px; height: 2px;
      background: var(--red);
    }
    .prod-use {
      font-size: 13.5px; color: var(--gray);
      line-height: 1.9;
    }
    @media (max-width: 800px) {
      .prod-grid { grid-template-columns: 1fr; }
      .prod-card { padding: 36px 28px; }
    }
  </style>
</head>
<body>

<!-- ════════════════════════════ NAV ════════════════════════════ -->

    <img class="logo-img" src="images/logo-2.png" alt="浙江轻纺 Light Textile Industry" />
  </a>

  <ul class="nav-links">
    <li><a href="index.html"          data-i18n="nav_home"></a></li>

    <li><a href="index.html#business" data-i18n="nav_products" class="nav-active"></a></li>
    <li><a href="dongfang.html"       data-i18n="nav_dongfang"></a></li>
  </ul>

  <div style="display:flex;align-items:center;gap:20px">
    <div class="lang-toggle">
      <button id="btn-cn" class="active" onclick="setLang('cn')">中文</button>
      <button id="btn-en"               onclick="setLang('en')">EN</button>
    </div>
    <div class="hamburger" id="ham" onclick="toggleMenu()">

    </div>
  </div>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="index.html"          onclick="toggleMenu()" data-i18n="nav_home"></a>
  <a href="about.html"          onclick="toggleMenu()" data-i18n="nav_about"></a>
  <a href="index.html#business" onclick="toggleMenu()" data-i18n="nav_products"></a>
  <a href="dongfang.html"       onclick="toggleMenu()" data-i18n="nav_dongfang"></a>
</div>

  </div>
