<!-- ════════════════════════════ NAV ════════════════════════════ -->
<nav id="nav">
  <a class="logo" href="#hero">
    <img class="logo-img" src="images/logo-2.png" alt="浙江轻纺 Light Textile Industry" />
  </a>

  <ul class="nav-links">
    <li><a href="#hero"     data-i18n="nav_home"></a></li>
    <li><a href="about.html" data-i18n="nav_about"></a></li>
    <li><a href="#business" data-i18n="nav_products"></a></li>
    <li><a href="#dongfang" data-i18n="nav_dongfang"></a></li>
  </ul>

  <div style="display:flex;align-items:center;gap:20px">
    <div class="lang-toggle">
      <button id="btn-cn" class="active" onclick="setLang('cn')">中文</button>
      <button id="btn-en"               onclick="setLang('en')">EN</button>
    </div>
    <div class="hamburger" id="ham" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </div>
  </div>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="#hero"     onclick="toggleMenu()" data-i18n="nav_home"></a>
  <a href="#about"    onclick="toggleMenu()" data-i18n="nav_about"></a>
  <a href="#business" onclick="toggleMenu()" data-i18n="nav_products"></a>
  <a href="#dongfang" onclick="toggleMenu()" data-i18n="nav_dongfang"></a>

<!-- ════════════════════════════ HERO ════════════════════════════ -->
<section class="hero" id="hero">

  <div class="slide slide-1 active"><div class="slide-art"></div></div>
  <div class="slide slide-2"><div class="slide-art"></div></div>
  <div class="slide slide-3"><div class="slide-art"></div></div>

  <div class="hero-overlay"></div>

  <div class="hero-content">
    <div class="hero-badge">
      <div class="hero-badge-dot"></div>
      <span class="hero-badge-text" data-i18n="hero_badge"></span>
    </div>

    <h1 class="hero-slogan" data-i18n="hero_slogan"></h1>
    <p  class="hero-sub"    data-i18n="hero_sub"></p>

    <div class="hero-btns">
      <a class="btn btn-red"   href="#business" data-i18n="hero_btn1"></a>
      <a class="btn btn-ghost" href="#contact"  data-i18n="hero_btn2"></a>
    </div>
  </div>

  <div class="scroll-cue">
    <div class="scroll-track"></div>
    <span data-i18n="scroll"></span>
  </div>

  <div class="hero-nav">
    <button class="h-arrow" id="prev">&#8592;</button>
    <div class="h-dots">
      <div class="h-dot on" data-i="0"></div>
      <div class="h-dot"    data-i="1"></div>
      <div class="h-dot"    data-i="2"></div>
    </div>
    <button class="h-arrow" id="next">&#8594;</button>
  </div>
</section>

<!-- ════════════════════════════ ABOUT ════════════════════════════ -->
<section class="section about" id="about">
  <div class="about-inner">
    <div class="about-text">
      <div class="tag rv"><span data-i18n="about_tag"></span></div>
      <h2 class="sec-title rv d1" data-i18n="about_title"></h2>
      <p  class="sec-en rv d1"   data-i18n="about_title_en"></p>

      <p class="about-lead rv d2" data-i18n="about_lead"></p>
      <p class="about-lead-en rv d2" data-i18n="about_lead_en"></p>

      <div class="stats rv d3">
        <div>
          <div class="stat-num">25<sup>+</sup></div>
          <div class="stat-lbl" data-i18n="stat1"></div>
        </div>
        <div>
          <div class="stat-num">3</div>
          <div class="stat-lbl" data-i18n="stat2"></div>
        </div>
        <div>
          <div class="stat-num">∞</div>
          <div class="stat-lbl" data-i18n="stat3"></div>
        </div>
      </div>
    </div>

    <div class="about-vis rv d2">
      <div class="about-line-v"></div>
      <div class="about-frame">
        <img src="images/oiltank.JPG" alt="油脂储运基地" style="width:100%;height:100%;object-fit:cover;display:block;" />
      </div>
      <div class="about-accent"></div>
    </div>
  </div>
</section>
