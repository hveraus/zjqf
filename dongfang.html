  <style>
    /* ── Page-specific overrides ── */

    /* ── Stats bar ── */
    .df-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--ink);
    }
    .df-stat {
      padding: 40px 36px;
      border-right: 1px solid rgba(255,255,255,.08);
      text-align: center;
    }
    .df-stat:last-child { border-right: none; }
    .df-stat-num {
      font-size: clamp(32px, 4vw, 46px);
      font-weight: 700;
      color: #fff;
      letter-spacing: 2px;
      line-height: 1;
      margin-bottom: 10px;
    }
    .df-stat-num sup { font-size: .5em; vertical-align: super; }
    .df-stat-num span { color: var(--red-light); }
    .df-stat-lbl {
      font-size: 11px; letter-spacing: 2px;
      color: rgba(255,255,255,.45);
      text-transform: uppercase;
      line-height: 1.6;
    }

    /* ── Intro split ── */
    .df-intro {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    .df-intro-text {
      padding: 80px 8%;
      background: var(--white);
    }
    .df-intro-img {
      position: relative;
      overflow: hidden;
      min-height: 460px;
    }
    .df-intro-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 8s ease;
    }
    .df-intro-img:hover img { transform: scale(1.04); }
    .df-intro-img::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(196,18,48,.12) 0%, transparent 60%);
    }
    .df-intro-text p {
      font-size: 15px;
      line-height: 2;
      color: var(--gray);
      letter-spacing: .3px;
      margin-bottom: 20px;
    }
    .df-intro-text p:last-child { margin-bottom: 0; }
    .df-intro-text strong { color: var(--ink); }

    /* ── Facilities ── */
    .df-facilities {
      padding: 88px 8%;
      background: var(--bg);
    }
    .df-fac-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      margin-top: 56px;
    }
    .df-fac-card {
      background: var(--white);
      padding: 44px 36px;
      position: relative;
      overflow: hidden;
    }
    .df-fac-card::before {
      content: '';
      position: absolute; top: 0; left: 0;
      width: 3px; height: 0;
      background: var(--red);
      transition: height .5s var(--ease);
    }
    .df-fac-card:hover::before { height: 100%; }
    .df-fac-icon {
      width: 48px; height: 48px;
      color: var(--red);
      margin-bottom: 24px;
    }
    .df-fac-title {
      font-size: 17px; font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .df-fac-title-en {
      font-size: 10px; letter-spacing: 2px;
      color: var(--muted); text-transform: uppercase;
      margin-bottom: 18px;
    }
    .df-fac-desc {
      font-size: 13.5px; color: var(--gray);
      line-height: 1.9;
    }

    /* ── Ship image band ── */
    .df-band {
      position: relative;
      height: 340px;
      background-image: url('images/hero.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .df-band::before {
      content: '';
      position: absolute; inset: 0;
      background: rgba(10,10,10,.55);
    }
    .df-band-text {
      position: relative; z-index: 2;
      text-align: center;
      color: #fff;
    }
    .df-band-text p {
      font-size: clamp(22px, 3vw, 36px);
      font-weight: 700;
      letter-spacing: 6px;
      color: #fff;
    }

    /* ── Contact ── */
    .df-contact {
      padding: 88px 8%;
      background: var(--white);
    }
    .df-contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      margin-top: 56px;
      align-items: start;
    }
    .df-c-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 24px 0;
      border-bottom: 1px solid var(--line);
    }
    .df-c-item:last-child { border-bottom: none; }
    .df-c-icon {
      width: 36px; height: 36px;
      background: var(--bg);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--red);
      flex-shrink: 0;
    }
    .df-c-lbl {
      font-size: 10px; letter-spacing: 2px;
      color: var(--muted); text-transform: uppercase;
      margin-bottom: 5px;
    }
    .df-c-val {
      font-size: 14px; color: var(--ink);
      line-height: 1.7;
    }
    .df-c-val a { color: var(--red); text-decoration: none; }
    .df-c-val a:hover { text-decoration: underline; }
    .df-map {
      background: var(--bg);
      border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      min-height: 280px;
      color: var(--muted);
      font-size: 12px; letter-spacing: 1.5px;
    }

    /* ── Gallery (auto-scroll marquee) ── */
    .df-gallery {
      padding: 88px 0 96px;
      background: var(--white);
      overflow: hidden;
    }
    .df-gallery .a-head {
      padding: 0 8%;
      margin-bottom: 52px;
    }
    .df-marquee {
      position: relative;
      width: 100%;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent);
              mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent);
    }
    .df-track {
      display: flex;
      gap: 24px;
      width: max-content;
      padding: 8px 0;
      animation: df-marquee 56s linear infinite;
    }
    .df-marquee:hover .df-track { animation-play-state: paused; }
    @keyframes df-marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(calc(-50% - 12px)); }
    }
    .df-shot {
      position: relative;
      flex: 0 0 auto;
      width: 440px;
      height: 300px;
      overflow: hidden;
      background: var(--bg);
    }
    .df-shot img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 1s var(--ease);
    }
    .df-shot::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(10,10,10,.5) 0%, transparent 45%);
      opacity: 0;
      transition: opacity .5s var(--ease);
    }
    .df-shot:hover img { transform: scale(1.07); }
    .df-shot:hover::after { opacity: 1; }
    .df-shot-num {
      position: absolute;
      top: 0; left: 0;
      z-index: 2;
      width: 46px; height: 46px;
      display: flex; align-items: center; justify-content: center;
      background: var(--red);
      color: #fff;
      font-size: 13px; font-weight: 700;
      letter-spacing: 1px;
      transform: translateY(-100%);
      transition: transform .45s var(--ease);
    }
    .df-shot:hover .df-shot-num { transform: translateY(0); }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .df-shot { width: 320px; height: 220px; }
      .df-stats { grid-template-columns: repeat(2, 1fr); }
      .df-intro  { grid-template-columns: 1fr; }
      .df-intro-img { min-height: 280px; }
      .df-fac-grid { grid-template-columns: 1fr; }
      .df-contact-grid { grid-template-columns: 1fr; gap: 40px; }
    }
    @media (max-width: 600px) {
      .df-stats { grid-template-columns: repeat(2, 1fr); }
      .df-hero-content { padding: 0 6% 40px; }
    }
  </style>
